[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rapidpassives-sweep"
version = "0.1.0"
description = "Python geometry generation + automated FEM parameter sweeps for rapidpassives (parallel to the TS web app)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "shapely>=2.0",
    "xarray>=2023.1",
]

[project.optional-dependencies]
solver = ["rapidfem"]
touchstone = ["scikit-rf>=0.29"]
netcdf = ["netCDF4>=1.6"]

[tool.setuptools]
packages = ["rapidpassives_sweep", "rapidpassives_sweep.geometry"]
package-dir = { "rapidpassives_sweep" = "." }
